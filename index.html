<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#203326"><title>Small Game Records NL — Hunting Days</title>
<style>
:root{color-scheme:dark;--bg:#101812;--card:#1d2b21;--line:#3b4d3e;--text:#f4f5ee;--muted:#bac5bb;--accent:#b6d58b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:18px system-ui,sans-serif}header{padding:22px 18px;background:#203326;border-bottom:1px solid var(--line)}header small{color:var(--accent);text-transform:uppercase;letter-spacing:.08em;font-weight:700}h1{font-size:26px;margin:5px 0}main{max-width:620px;margin:auto;padding:14px;display:grid;gap:14px}.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}h2{font-size:21px;margin:0 0 12px}label{display:grid;gap:7px;margin:14px 0;color:var(--muted)}input{width:100%;padding:14px;border-radius:9px;border:1px solid var(--line);background:#111a14;color:var(--text);font:inherit}button{border:0;border-radius:9px;padding:14px 16px;font:inherit;background:var(--accent);color:#152017;font-weight:800;width:100%;margin-top:10px}.total{font-size:25px;color:var(--accent);font-weight:800}.entry{border-top:1px solid var(--line);padding:14px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}.entry strong{font-size:18px}.entry span{color:var(--accent);font-weight:700}.entry button{width:auto;margin:0;padding:8px 12px;background:transparent;border:1px solid #75443e;color:#ffb4a9;font-size:14px}.empty{color:var(--muted);text-align:center;padding:18px 0}.hint{color:var(--muted);font-size:14px}
</style></head><body><header><small>Newfoundland & Labrador</small><h1>Small Game Records NL</h1></header><main>
<section class="panel"><h2>Record hunting days</h2><p class="hint">Record the date you hunted and how many days you hunted. You can record a hunt even when you caught nothing.</p><form id="form"><label>Date hunted<input id="date" type="date" required></label><label>Number of days hunted<input id="days" type="number" min="1" max="365" value="1" required></label><button type="submit">Save hunting days</button></form></section>
<section class="panel"><h2>Previous records</h2><p>Total days hunted: <span id="total" class="total">0</span></p><div id="records"></div></section>
</main><script>
(()=>{const $=id=>document.getElementById(id),key='small-game-records-nl-v2';function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')} $('date').value=today();let data=[];try{let raw=localStorage.getItem(key)||localStorage.getItem(key+'-backup')||localStorage.getItem('small-game-records-nl-v1')||localStorage.getItem('small-game-records')||localStorage.getItem('huntingRecords');let old=raw?JSON.parse(raw):[];if(Array.isArray(old))data=old.map((r,i)=>({id:r.id||String(i),date:r.date||today(),days:Math.max(1,Number(r.daysHunted||r.days||1)||1)}))}catch(e){data=[]}function save(){let raw=JSON.stringify(data);try{localStorage.setItem(key,raw);localStorage.setItem(key+'-backup',raw);if(localStorage.getItem(key)!==raw)throw Error('storage check failed');return true}catch(e){alert('Could not save on this device. Check app storage settings.');return false}}function render(){data.sort((a,b)=>b.date.localeCompare(a.date));$('total').textContent=data.reduce((sum,r)=>sum+r.days,0);$('records').innerHTML=data.length?data.map(r=>'<div class="entry"><div><strong>'+r.date+'</strong><br><span>'+r.days+' day'+(r.days===1?'':'s')+' hunted</span></div><button type="button" data-id="'+String(r.id).replace(/"/g,'')+'">Delete</button></div>').join(''):'<div class="empty">No hunting days saved yet.</div>'}$('form').addEventListener('submit',e=>{e.preventDefault();const date=$('date').value,days=Math.max(1,Math.min(365,Number($('days').value)||1));if(!date)return;data.push({id:Date.now().toString()+Math.random().toString(36).slice(2),date,days});if(save()){render();$('date').value=today();$('days').value='1'}});$('records').addEventListener('click',e=>{const b=e.target.closest('button[data-id]');if(!b)return;data=data.filter(r=>String(r.id)!==b.dataset.id);if(save())render()});render()})();
</script></body></html>
