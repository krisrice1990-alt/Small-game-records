# Rebuild the installable APK whenever Android app files change.
name: Build Small Game Records NL APK

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "android/**"
      - ".github/workflows/small-game-records-nl-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Use stable debug signing key for in-place updates
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode android/signing/debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Build debug APK
        run: gradle --no-daemon -p android assembleDebug

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Small-Game-Records-NL-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
